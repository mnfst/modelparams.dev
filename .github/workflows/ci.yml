name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Also run on PRs stacked onto a feature branch, not just those targeting
    # main, so every PR in a stack is verified before its base lands.
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"

jobs:
  build:
    name: Lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate model YAML
        run: npm run validate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  modelparams-pkg:
    name: modelparams package (codegen + build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Codegen
        run: npm run codegen --workspace=modelparams

      - name: Verify generated files are in sync
        run: |
          if ! git diff --quiet -- packages/modelparams/src/generated; then
            echo "::error::Generated files in packages/modelparams/src/generated are out of date."
            echo "Run \`npm run codegen --workspace=modelparams\` locally and commit the result."
            git diff --stat -- packages/modelparams/src/generated
            exit 1
          fi

      - name: Typecheck package
        run: npm run typecheck --workspace=modelparams

      - name: Build package
        run: npm run build --workspace=modelparams

      - name: Runtime tests
        run: npm test --workspace=modelparams

      - name: Type-level tests (tsd)
        run: npm run test:types --workspace=modelparams

  modelparams-mcp-pkg:
    name: modelparams-mcp package (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The MCP server imports the built catalog from the sibling package.
      - name: Build modelparams
        run: npm run build --workspace=modelparams

      - name: Typecheck package
        run: npm run typecheck --workspace=modelparams-mcp

      - name: Build package
        run: npm run build --workspace=modelparams-mcp

      - name: Tests
        run: npm test --workspace=modelparams-mcp

      - name: Server starts and answers over stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node packages/modelparams-mcp/dist/index.js 2>/dev/null \
            | grep -q 'validate_model_params' \
            || { echo "::error::MCP server did not advertise its tools over stdio"; exit 1; }
