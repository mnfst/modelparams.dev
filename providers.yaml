# Provider API endpoints — the base URLs an SDK configures to reach each host.
# Only endpoints this catalog's prober actually drives are listed; a provider
# absent here simply can't be resolved by URL yet.
anthropic:
  - https://api.anthropic.com
openai:
  - https://api.openai.com/v1
google:
  - https://generativelanguage.googleapis.com
deepseek:
  - https://api.deepseek.com/v1
  - https://api.deepseek.com
xai:
  - https://api.x.ai/v1
mistral:
  - https://api.mistral.ai/v1
moonshot:
  - https://api.moonshot.ai/v1
  - https://api.moonshot.cn/v1
alibaba:
  - https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  - https://dashscope.aliyuncs.com/compatible-mode/v1
z-ai:
  - https://api.z.ai/api/paas/v4
groq:
  - https://api.groq.com/openai/v1
fireworks:
  - https://api.fireworks.ai/inference/v1
bedrock:
  # One host family: * matches a single label, so every AWS region resolves
  # without enumerating regions that change.
  - https://bedrock-runtime.*.amazonaws.com
vertex:
  # Express mode resolves without a project; the regional hosts carry one. The
  # wildcard matches a single label, so every location works without listing
  # regions that change.
  - https://aiplatform.googleapis.com
  - https://*-aiplatform.googleapis.com
opencode-go:
  # OpenCode Go subscription gateway (OpenAI-compatible bearer token).
  - https://opencode.ai/zen/go/v1
