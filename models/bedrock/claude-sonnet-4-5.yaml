# yaml-language-server: $schema=https://modelparams.dev/api/v1/schema.json
provider: bedrock
authType: api_key
model: claude-sonnet-4-5
requestModel: us.anthropic.claude-sonnet-4-5-20250929-v1:0
params:
  - path: inferenceConfig.maxTokens
    type: integer
    label: Max tokens
    description: Maximum number of output tokens the model may generate.
    range:
      min: 1
    group: generation_length
  - path: inferenceConfig.temperature
    type: number
    label: Temperature
    description: >-
      Controls randomness. Lower values make outputs more focused; higher values make them more
      varied. Bedrock rejects values above 1, and the model requires 1 when thinking is enabled.
    default: 1
    range:
      min: 0
      max: 1
      step: 0.1
    group: sampling
    applicability:
      except:
        additionalModelRequestFields.thinking.type: enabled
  - path: inferenceConfig.topP
    type: number
    label: Top P
    description: >-
      Controls nucleus sampling by limiting generation to tokens whose cumulative probability
      reaches this value. Must be at least 0.95 or unset when thinking is enabled.
    default: 1
    range:
      min: 0
      max: 1
      step: 0.01
    group: sampling
    applicability:
      except:
        - additionalModelRequestFields.thinking.type: enabled
        - inferenceConfig.temperature:
            not: 1
  - path: inferenceConfig.stopSequences
    type: string
    label: Stop sequences
    description: A list of strings where the model stops generating further tokens.
    group: generation_length
  - path: additionalModelRequestFields.top_k
    type: integer
    label: Top K
    description: Limits token sampling to the top K most likely next tokens.
    default: 0
    range:
      min: 0
    group: sampling
    applicability:
      except:
        additionalModelRequestFields.thinking.type: enabled
  - path: additionalModelRequestFields.thinking.type
    type: enum
    label: Thinking mode
    description: >-
      Controls Anthropic extended thinking on Bedrock. Unlike the first-party Anthropic API, the
      adaptive mode is rejected on Bedrock for this model.
    default: disabled
    values:
      - disabled
      - enabled
    group: reasoning
  - path: additionalModelRequestFields.thinking.budget_tokens
    type: integer
    label: Budget tokens
    description: >-
      Maximum token budget the model may use for extended thinking before producing the final
      answer. Must be less than inferenceConfig.maxTokens.
    range:
      min: 1024
    group: reasoning
    applicability:
      only:
        additionalModelRequestFields.thinking.type: enabled
