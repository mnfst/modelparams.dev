# yaml-language-server: $schema=https://modelparams.dev/api/v1/schema.json
provider: bedrock
authType: api_key
model: claude-sonnet-4-5
requestModel: "{scope}.anthropic.claude-sonnet-4-5-20250929-v1:0"
params:
  - path: inferenceConfig.maxTokens
    type: integer
    label: Max tokens
    description: Maximum number of output tokens the model may generate.
    range:
      min: 1
    group: generation_length
  - path: inferenceConfig.temperature
    type: number
    label: Temperature
    description: >-
      Controls randomness. Lower values make outputs more focused; higher values make them more
      varied. Bedrock rejects values above 1 for this model.
    range:
      min: 0
      max: 1
      step: 0.1
    group: sampling
  - path: inferenceConfig.topP
    type: number
    label: Top P
    description: >-
      Controls nucleus sampling by limiting generation to tokens whose cumulative probability
      reaches this value.
    range:
      min: 0
      max: 1
      step: 0.01
    group: sampling
  - path: inferenceConfig.stopSequences
    type: string
    label: Stop sequences
    description: A list of strings where the model stops generating further tokens.
    group: generation_length
  - path: additionalModelRequestFields.top_k
    type: integer
    label: Top K
    description: >-
      Limits token sampling to the top K most likely next tokens. Converse carries it through
      additionalModelRequestFields; it is not part of inferenceConfig.
    range:
      min: 0
    group: sampling
  - path: additionalModelRequestFields.thinking.type
    type: enum
    label: Thinking mode
    description: >-
      Controls Anthropic extended thinking on Bedrock. Bedrock rejects the adaptive mode the
      first-party Anthropic API accepts, so only disabled and enabled are listed here.
    default: disabled
    values:
      - disabled
      - enabled
    group: reasoning
  - path: additionalModelRequestFields.thinking.budget_tokens
    type: integer
    label: Budget tokens
    description: >-
      Maximum token budget the model may use for extended thinking before producing the final
      answer. Must be less than inferenceConfig.maxTokens.
    range:
      min: 1024
    group: reasoning
    applicability:
      only:
        additionalModelRequestFields.thinking.type: enabled
