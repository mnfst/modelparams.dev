# yaml-language-server: $schema=https://modelparams.dev/api/v1/schema.json
provider: bedrock
authType: api_key
model: mixtral-8x7b-instruct
wireId: mistral.mixtral-8x7b-instruct-v0:1
params:
  - path: inferenceConfig.maxTokens
    type: integer
    label: Max tokens
    description: Maximum number of output tokens the model may generate.
    range:
      min: 1
    group: generation_length
  - path: inferenceConfig.temperature
    type: number
    label: Temperature
    description: >-
      Controls randomness. Lower values make outputs more focused; higher values make them more
      varied. Bedrock rejects values above 1 for this model.
    range:
      min: 0
      max: 1
      step: 0.1
    group: sampling
  - path: inferenceConfig.topP
    type: number
    label: Top P
    description: >-
      Controls nucleus sampling by limiting generation to tokens whose cumulative probability
      reaches this value.
    range:
      min: 0
      max: 1
      step: 0.01
    group: sampling
  - path: inferenceConfig.stopSequences
    type: string
    label: Stop sequences
    description: A list of strings where the model stops generating further tokens.
    group: generation_length
  - path: additionalModelRequestFields.top_k
    type: integer
    label: Top K
    description: >-
      Limits token sampling to the top K most likely next tokens. Converse carries it through
      additionalModelRequestFields; it is not part of inferenceConfig.
    range:
      min: 0
    group: sampling
