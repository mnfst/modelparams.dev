# yaml-language-server: $schema=https://modelparams.dev/api/v1/schema.json
provider: moonshot
authType: subscription
apiSurface: openai-chat-completions
model: kimi-k2.6
status: active
params:
  - path: max_completion_tokens
    type: integer
    label: Max tokens
    description: Maximum number of tokens to generate in the chat completion.
    range:
      min: 1
    group: generation_length
  - path: thinking.type
    type: enum
    label: Thinking mode
    description: >-
      Controls whether Kimi reasons step by step before answering. Thinking is enabled by default;
      set disabled to respond directly.
    default: enabled
    values:
      - enabled
      - disabled
    group: reasoning
  - path: thinking.keep
    type: enum
    label: Keep prior reasoning
    description: >-
      Set to all to carry reasoning content from earlier assistant turns into the request; leave
      null to send only the final answers.
    default: null
    values:
      - all
      - null
    group: reasoning
  - path: response_format.type
    type: enum
    label: Response format
    description: Forces the response into plain text or a JSON object.
    default: text
    values:
      - text
      - json_object
    group: output_format
