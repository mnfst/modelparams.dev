# yaml-language-server: $schema=https://modelparams.dev/api/v1/schema.json
provider: moonshot
authType: api_key
model: moonshot-v1-32k
status: deprecated
replacement: moonshot/kimi-k2.6
shutdownOn: 2026-08-31
params:
  - path: max_completion_tokens
    type: integer
    label: Max tokens
    description: Maximum number of tokens to generate in the chat completion.
    range:
      min: 1
    group: generation_length
  - path: stop
    type: string
    label: Stop sequence
    description: >-
      Stops generation when this sequence is produced. Moonshot accepts up to 5 sequences of at most
      32 bytes each.
    group: generation_length
  - path: temperature
    type: number
    label: Temperature
    description: >-
      Controls randomness. Lower values make outputs more focused; higher values make them more
      varied.
    default: 0.3
    range:
      min: 0
      max: 1
      step: 0.1
    group: sampling
  - path: top_p
    type: number
    label: Top P
    description: >-
      Controls nucleus sampling by limiting generation to tokens within the selected cumulative
      probability.
    default: 1
    range:
      min: 0
      max: 1
      step: 0.01
    group: sampling
  - path: n
    type: integer
    label: Number of completions
    description: How many chat completion choices to generate for the request.
    default: 1
    range:
      min: 1
      max: 5
    group: generation_length
  - path: presence_penalty
    type: number
    label: Presence penalty
    description: >-
      Penalizes tokens that have already appeared, encouraging the model to talk about new topics.
    default: 0
    range:
      min: -2
      max: 2
      step: 0.1
    group: sampling
  - path: frequency_penalty
    type: number
    label: Frequency penalty
    description: Penalizes tokens by how often they have appeared, reducing verbatim repetition.
    default: 0
    range:
      min: -2
      max: 2
      step: 0.1
    group: sampling
  - path: response_format.type
    type: enum
    label: Response format
    description: Forces the response into plain text or a JSON object.
    default: text
    values:
      - text
      - json_object
    group: output_format
  - path: tool_choice
    type: enum
    label: Tool choice
    description: >-
      Controls tool calling: auto lets the model decide, none blocks tool calls, and required forces
      one.
    default: auto
    values:
      - auto
      - none
      - required
    group: tooling
  - path: logprobs
    type: boolean
    label: Log probabilities
    description: Controls whether the response includes log probabilities for the generated tokens.
    default: false
    group: observability
  - path: top_logprobs
    type: integer
    label: Top log probabilities
    description: Number of most likely tokens to return a log probability for at each position.
    range:
      min: 0
      max: 20
    group: observability
    applicability:
      only:
        logprobs: true
