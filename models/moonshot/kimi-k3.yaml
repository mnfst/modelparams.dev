# yaml-language-server: $schema=https://modelparams.dev/api/v1/schema.json
provider: moonshot
authType: api_key
model: kimi-k3
params:
  - path: max_completion_tokens
    type: integer
    label: Max tokens
    description: Maximum number of tokens to generate in the chat completion.
    range:
      min: 1
    group: generation_length
  - path: stop
    type: string
    label: Stop sequence
    description: >-
      Stops generation when this sequence is produced. Moonshot accepts up to 5 sequences of at most
      32 bytes each.
    group: generation_length
  - path: reasoning_effort
    type: enum
    label: Reasoning effort
    description: >-
      Controls how much reasoning Kimi performs before answering. Thinking is always on for this
      model, so it cannot be turned off.
    default: max
    values:
      - low
      - high
      - max
    group: reasoning
  - path: response_format.type
    type: enum
    label: Response format
    description: Forces the response into plain text, a JSON object, or JSON matching a provided schema.
    default: text
    values:
      - text
      - json_object
      - json_schema
    group: output_format
  - path: tool_choice
    type: enum
    label: Tool choice
    description: >-
      Controls tool calling: auto lets the model decide, none blocks tool calls, and required forces
      one.
    default: auto
    values:
      - auto
      - none
      - required
    group: tooling
  - path: logprobs
    type: boolean
    label: Log probabilities
    description: Controls whether the response includes log probabilities for the generated tokens.
    default: false
    group: observability
  - path: top_logprobs
    type: integer
    label: Top log probabilities
    description: Number of most likely tokens to return a log probability for at each position.
    range:
      min: 0
      max: 20
    group: observability
    applicability:
      only:
        logprobs: true
